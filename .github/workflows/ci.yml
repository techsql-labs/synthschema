name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest

  minimum-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimum supported dependencies (no Faker)
        run: |
          python -m pip install --upgrade pip
          pip install "numpy==1.24.4" "pandas==2.0.3" "scipy==1.10.1" pytest pyyaml
          pip install -e . --no-deps
      - name: Test
        run: pytest

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check runtime dependency licences
        run: |
          pip install . pip-licenses
          pip-licenses --packages numpy pandas scipy python-dateutil pytz tzdata six \
            --fail-on="Business Source License;BSL;GPL;AGPL;LGPL;SSPL"
